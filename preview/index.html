<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quán Hải Sản · Asset Library</title><style>
:root{color-scheme:dark}body{margin:0;padding:20px;background:radial-gradient(circle at 50% 0,#413359,#150d25);font-family:system-ui;color:#ffedc7}header,main{max-width:940px;margin:0 auto}header{border-bottom:2px solid #865a73;padding:14px 0 22px}h1{color:#ffcc6a}h2{color:#fff3bf;font-size:18px;margin:30px 0 13px}a{color:#ffcc6a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:14px}.item{border:2px solid #8a615c;background:#2a1b34;border-radius:12px;padding:12px;text-align:center}.item img{image-rendering:pixelated;object-fit:contain;width:108px;height:108px;max-width:100%;display:block;margin:auto}.item.char img{width:104px;height:156px;object-fit:contain}.item strong{display:block;font-size:12px;margin-top:6px}.scene{width:100%;max-height:420px;object-fit:contain;border-radius:12px;border:3px solid #9f775b}.hint{color:#dec6c8;font-size:13px}
</style></head><body><header><h1>🐟 Quán Hải Sản · Asset Library</h1><p>31 hình pixel art gốc được tạo cho dự án, có thể dùng trực tiếp trong game và xuất sang sprite atlas sau này.</p><p><a href="../demo/">Thử game HTML</a> · <a href="../README.md">Tài liệu dự án</a></p></header><main><h2>Concept thế giới</h2><img class="scene" src="../public/assets/harbor-map.webp" alt="Quán Hải Sản"><div id="assets"></div></main><script>
const groups=[['Hải sản','seafood',['ca-thu','ca-ngu','tom','muc','so','cua','hau']],['Nhân vật · 4 hướng × 4 frame','characters',['ngu-choi','chu-tam','co-sau','dau-bep','phuc-vu','khach-nam','khach-nu']],['Vật thể','props',['ban-go','ghe-go','thung-ca','tu-hai-san','bep','can-cau','den-long','cay-canh','thuyen','ruong']],['Tranh truyện','story',['chapter-1','chapter-2','chapter-3','chapter-4','chapter-5']]];
document.getElementById('assets').innerHTML=groups.map(([title,folder,ids])=>`<h2>${title}</h2><div class="grid">${ids.map(id=>`<div class="item ${folder==='characters'?'char':''}"><img loading="lazy" src="../public/assets/pixel/${folder}/${id}.png" alt="${id}"><strong>${id}</strong></div>`).join('')}</div>`).join('');
</script></body></html>
