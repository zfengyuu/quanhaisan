<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Quán Hải Sản — Playable Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#120c24;color:#fbeac4;font-family:system-ui,-apple-system,sans-serif}button{cursor:pointer;font:inherit}.shell{max-width:540px;margin:auto;background:#231536;box-shadow:0 0 50px #000a;min-height:100vh}.header{display:flex;align-items:center;justify-content:space-between;gap:5px;background:#31204a;border-bottom:4px solid #7d5590;padding:12px 9px}.header strong{font-size:15px}.coins,.diamonds{background:#180f28;border:2px solid #86649d;border-radius:12px;padding:7px 9px;font-size:13px;font-weight:800}.scene{position:relative;aspect-ratio:941/1088;background:url('../public/assets/harbor-map.webp') center /100% 100%;image-rendering:pixelated}.scene>button{position:absolute;background:#231436e6;color:#ffe6a4;border:2px solid #f0bd65;border-radius:12px;font-size:12px;padding:8px}.fish-point{top:18%;left:2%}.market-point{top:49%;left:3%}.sell-point{top:45%;right:5%}.donate-point{bottom:5%;right:4%}.panel{padding:11px;background:#241735;border-top:4px solid #130d1b}.stocktitle{font-weight:900;font-size:17px;margin-bottom:11px}.stock{display:flex;gap:7px;overflow:auto}.fish-card{min-width:79px;border:3px solid #6d4736;border-radius:12px;background:#fff3db;color:#503129;display:flex;flex-direction:column;align-items:center;padding:7px}.fish-card .emoji{font-size:36px}.fish-card .name{font-size:12px;font-weight:800}.fish-card .quantity{font-size:11px;background:#51392f;border-radius:7px;color:#fff;padding:2px 5px}.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:10px 7px;background:#2c1a41}.nav button{border:3px solid #9d714a;border-radius:12px;background:#fff3d9;color:#6f4330;padding:10px 0;font-size:9px;font-weight:900}.nav button:first-child{background:#ffc74c}.nav span{display:block;font-size:22px;margin-bottom:6px}.footer{text-align:center;font-size:10px;color:#b8a3c8;padding:18px}.shade{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:13px;z-index:10}.shade.active{display:flex}.dialog{width:min(100%,480px);max-height:86vh;overflow:auto;border:4px solid #9064a0;border-radius:18px;background:#312046;box-shadow:0 12px 0 #170f21}.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#4c2f61;border-bottom:3px solid #855d97}.dhead h2{margin:0;font-size:20px}.exit{background:#2c193e;color:white;border:2px solid #9c7ab3;border-radius:9px;padding:5px 12px}.body{padding:17px}.row{display:flex;align-items:center;gap:11px;margin:7px 0;padding:9px;background:#422d53;border-radius:11px;border:1px solid #765983}.row .ico{font-size:30px}.row .info{flex:1;font-size:12px}.row small{display:block;color:#d3c1da;margin-top:5px}.row button,.primary{border:2px solid #bb8743;border-radius:10px;background:#ffd06e;color:#593b2a;font-weight:900;padding:10px;font-size:12px}.row button:disabled{opacity:.4}.primary{width:100%;padding:14px;margin:8px 0}.body p{font-size:13px;line-height:1.65}.qrcode{margin:15px auto;width:230px;height:230px;background:#fff8e8;color:#514566;display:grid;place-items:center;text-align:center;border-radius:10px}.qrcode img{max-width:215px;max-height:215px}.meter{height:30px;background:linear-gradient(90deg,#e07a5e 0 38%,#57cf8f 38% 70%,#e07a5e 70%);border:3px solid #ddb87a;border-radius:10px;position:relative;margin:20px 0}.needle{position:absolute;left:0;top:-8px;width:8px;height:40px;background:white;border:2px solid #613a6c}.water{text-align:center;font-size:56px;padding:25px;border-radius:13px;background:linear-gradient(#72cfdc,#166a9a)}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff1c9;color:#422e27;border:3px solid #be8d54;border-radius:15px;padding:12px 20px;font-weight:800;display:none;z-index:20;font-size:12px;max-width:90vw}.toast.show{display:block}

.story-point{top:1%;right:3%}.npc{position:absolute;z-index:4;font-size:25px;filter:drop-shadow(2px 3px 1px #2315218c);transition:left 3.7s linear,top 3.7s linear;cursor:pointer}.npc .bubble{font-size:12px;position:absolute;top:-24px;left:-10px;white-space:nowrap;border:2px solid #956a4b;border-radius:8px;padding:3px;background:#ffeed2;color:#452c2a}.coach{position:fixed;z-index:30;bottom:16px;left:50%;transform:translateX(-50%);width:min(95vw,460px);padding:15px;border:3px solid #ebc474;border-radius:16px;background:#2b1c40;color:#fff0d1;box-shadow:0 0 0 7px #0004,0 12px 35px #0009;display:none}.coach strong{color:#ffe08e}.coach p{font-size:12px;line-height:1.6}.coach button{background:#ffcc70;border:2px solid #bd8a4d;border-radius:9px;padding:9px;font-weight:800}.coach .skip{background:#3e2c50;color:#eee0f3}.coach-buttons{display:flex;gap:8px}.coach-buttons button:first-child{flex:1}.paper{background:#f8edda;color:#50392e;border:4px solid #d7b783;border-radius:12px;padding:17px}.paper h3{color:#983d2f}.paper p{line-height:1.85;font-size:13px}.paper .scene-img{width:100%;height:190px;object-fit:cover;object-position:center 30%;border:4px solid #5b3d32}.paper .goals{padding:12px;background:#ead7b4;border-radius:10px}.paper .goals div{padding:8px 0;border-bottom:1px dashed #b78c6a}.chapters{display:flex;gap:8px;margin-bottom:12px}.chapters button{flex:1;background:#eab967;border:2px solid #a66d4a;border-radius:9px;padding:8px}.chapters button:disabled{opacity:.35}.npc-queue{position:absolute;bottom:4%;right:2%;z-index:3;background:#301b48ee;border:2px solid #efc374;border-radius:10px;padding:7px;color:#fff4d0;font-size:11px;display:none;cursor:pointer}
</style></head><body><div class="shell"><header class="header"><strong>👒 Quán Hải Sản <small id="level">Lv. 1</small></strong><div class="coins">🪙 <span id="coins">1.200</span></div><div class="diamonds">💎 22</div><button onclick="show('help')" aria-label="Hướng dẫn">⚙️</button></header><div class="scene"><button class="fish-point" onclick="show('fish')">🎣 Câu cá</button><button class="market-point" onclick="show('market')">🧺 Chợ hải sản</button><button class="sell-point" onclick="show('sell')">🪙 Bán cá</button><button class="donate-point" onclick="show('donate')">❤️ Donate</button><button class="story-point" onclick="show('story')">📖 Chuyện Bến Nhỏ</button><button id="queue" class="npc-queue" onclick="show('sell')">🍽️ Khách đang chờ</button></div><div class="panel"><div class="stocktitle">🧺 Kho Hải Sản <small id="total"></small></div><div id="stock" class="stock"></div></div><nav class="nav"><button onclick="show('fish')"><span>🎣</span>Câu cá</button><button onclick="show('market')"><span>🧺</span>Nhập hàng</button><button onclick="show('sell')"><span>🪙</span>Bán cá</button><button onclick="show('upgrade')"><span>🏡</span>Nâng cấp</button><button onclick="show('explore')"><span>🗺️</span>Khám phá</button></nav><footer class="footer">Playable demo HTML không cần cài npm · Tiền ảo không liên quan ngân hàng</footer></div><div class="shade" id="shade" onclick="if(event.target===this)hide()"><div class="dialog"><header class="dhead"><h2 id="title"></h2><button class="exit" onclick="hide()">✕</button></header><div class="body" id="body"></div></div></div><div class="toast" id="toast"></div><div class="coach" id="coach"><strong id="guide-title"></strong><p id="guide-body"></p><div class="coach-buttons"><button id="guide-next" onclick="guideNext()">Tiếp tục</button><button class="skip" onclick="guideSkip()">Bỏ qua</button></div></div><script>
const ITEMS=[['ca-thu','Cá thu','🐟',95,60],['ca-ngu','Cá ngừ','🐠',145,90],['tom','Tôm','🦐',80,50],['muc','Mực','🦑',125,80],['so','Sò','🐚',55,35],['cua','Cua','🦀',175,110],['hau','Hàu','🦪',110,70]];
const init={coins:1200,xp:0,upgrades:0,area:1,inventory:{'ca-thu':3,'ca-ngu':1,tom:4,muc:1,so:6,cua:0,hau:2},lastFishAt:0};
let game;try{game=JSON.parse(localStorage.getItem('qhs-standalone'))||structuredClone(init)}catch{game=structuredClone(init)}
game.lifetimeCaught??=0;game.lifetimeSold??=0;
let panel=null,raf=null,position=0,guide=localStorage.getItem('qhs-standalone-guide')==='done'?'done':'intro';const fmt=n=>n.toLocaleString('vi-VN');const save=()=>{localStorage.setItem('qhs-standalone',JSON.stringify(game));render()};
function render(){document.getElementById('coins').textContent=fmt(game.coins);document.getElementById('level').textContent='Lv. '+(Math.floor(game.xp/100)+1);document.getElementById('total').textContent='('+Object.values(game.inventory).reduce((a,b)=>a+b,0)+')';document.getElementById('stock').innerHTML=ITEMS.map(([id,name,icon])=>`<button class="fish-card" onclick="show('sell')"><span class="quantity">${game.inventory[id]||0}</span><span class="emoji">${icon}</span><span class="name">${name}</span></button>`).join('')}
function notice(t){const n=document.getElementById('toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2800)}
function hide(){document.getElementById('shade').classList.remove('active');cancelAnimationFrame(raf);panel=null;drawGuide()}
function transaction(action,id){const f=ITEMS.find(f=>f[0]===id);if(action==='buy'){if(game.coins<f[3])return notice('Không đủ xu!');game.coins-=f[3];game.inventory[id]++;advanceGuide('buy')}if(action==='sell'){if(!game.inventory[id])return notice('Hết hàng trong kho!');game.inventory[id]--;game.coins+=f[4]+game.upgrades*5;game.xp+=10;game.lifetimeSold++;serveNPC();advanceGuide('sell')}if(action==='upgrade'){const cost=300+game.upgrades*250;if(game.coins<cost)return notice('Thiếu xu nâng cấp!');game.coins-=cost;game.upgrades++;game.xp+=30}if(action==='unlock'){const cost=800*game.area;if(game.area>=3)return notice('Đã mở hết vùng biển');if(game.coins<cost)return notice('Thiếu xu mở biển!');game.coins-=cost;game.area++;game.xp+=50}save();notice('✅ Giao dịch thành công!');show(panel)}
function show(p){cancelAnimationFrame(raf);panel=p;const titles={fish:'🎣 Câu cá ngoài khơi',market:'🧺 Chợ hải sản',sell:'🪙 Bán hải sản',upgrade:'🏡 Nâng cấp quán',explore:'🗺️ Khám phá',donate:'❤️ Ủng hộ tác giả',story:'📖 Chuyện Bến Nhỏ',help:'⚙️ Hướng dẫn'};document.getElementById('title').textContent=titles[p];const body=document.getElementById('body');document.getElementById('shade').classList.add('active');document.getElementById('coach').style.display='none';
if(p==='story'){showStory();return}
if(p==='fish'){body.innerHTML='<div class="water">🌊 🎣 🐟</div><p>Canh thanh chạy vào vùng xanh và nhấn giật cần!</p><div class="meter"><div class="needle" id="needle"></div></div><button class="primary" onclick="hook()">🎣 Giật cần</button><p id="fmessage">Cá đang bơi quanh đây...</p>';let tick=0;function animate(){tick++;position=50+48*Math.sin(tick/18);const n=document.getElementById('needle');if(n)n.style.left=position+'%';raf=requestAnimationFrame(animate)}animate();return}
if(p==='market'||p==='sell'){body.innerHTML='<p>'+(p==='market'?'Nhập hải sản bằng xu ảo từ chợ.':'Bán hải sản trong kho để kiếm xu và XP.')+'</p>'+ITEMS.map(([id,name,icon,buy,sell])=>`<div class="row"><span class="ico">${icon}</span><div class="info"><strong>${name}</strong><small>Kho: ${game.inventory[id]} con</small></div><button onclick="transaction('${p==='market'?'buy':'sell'}','${id}')">${p==='market'?'-'+buy:'+'+(sell+game.upgrades*5)} xu</button></div>`).join('');return}
if(p==='upgrade'){body.innerHTML=`<div class="water">🏡</div><p>Quán cấp ${game.upgrades+1}. Tăng ${game.upgrades*5} xu mỗi lần bán cá.</p><button class="primary" onclick="transaction('upgrade')">Nâng cấp ${fmt(300+game.upgrades*250)} xu</button>`;return}
if(p==='explore'){body.innerHTML='<div class="water">⛵ 🏝️ 🪸</div><p>Vùng biển hiện tại: '+game.area+'/3. Mở biển mới để câu thêm các loài cá quý hiếm.</p><button class="primary" onclick="transaction(\'unlock\')">Mở biển · '+fmt(800*game.area)+' xu</button>';return}
if(p==='donate'){body.innerHTML='<p style="text-align:center">Mời tác giả một ly cà phê để phát triển game nhé. Donate là tự nguyện và không đổi lấy xu trong game.</p><div class="qrcode" id="qr"><span>Ảnh QR ngân hàng cá nhân<br/><small>Thêm <code>public/donate-qr.png</code></small></span></div><p style="text-align:center">Game không xử lý giao dịch ngân hàng.</p>';const img=new Image;img.onload=()=>document.getElementById('qr').innerHTML='<img alt="QR Donate" src="'+img.src+'">';img.src='../public/donate-qr.png';return}
body.innerHTML='<p>🎣 Câu cá → 🧺 Nhập hàng → 🪙 Bán cá → 🏡 Nâng cấp → 🗺️ Khám phá</p><p>Tiến trình demo được tự động lưu trên trình duyệt. Bản Next.js đi kèm cho phép bật Supabase và cài đặt PWA.</p>'}
function hook(){if(position<38||position>70)return document.getElementById('fmessage').textContent='💦 Cá thoát! Hãy thử lại!';if(Date.now()-game.lastFishAt<3000)return document.getElementById('fmessage').textContent='Cần nghỉ 3 giây giữa các lần câu.';const pool=game.area===1?['ca-thu','ca-thu','tom','so','ca-ngu']:ITEMS.map(x=>x[0]);const id=pool[Math.floor(Math.random()*pool.length)];game.inventory[id]++;game.lastFishAt=Date.now();game.xp+=15;game.lifetimeCaught++;advanceGuide('fish');save();document.getElementById('fmessage').textContent='🎉 Bắt được '+ITEMS.find(x=>x[0]===id)[1]+'!';notice('🐟 Cá đã vào kho!')}

const STORY=[
 ['Ngày trở về','Chú Tám','Sau nhiều năm sống ở thành phố, bạn trở về Bến Nhỏ. Quán hải sản của ông ngoại đã đóng cửa từ lâu. Trong chiếc rương gỗ, bạn tìm thấy cần câu cũ và lời nhắn: “Biển không phụ người chịu khó.” Chú Tám đang vá lưới ngẩng lên cười: “Đi câu với chú một chuyến, rồi quán mình lại sáng đèn!”',[['Câu được 3 con cá','lifetimeCaught',3],['Bán 2 con cá','lifetimeSold',2]]],
 ['Chợ cá sáng','Cô Sáu','Cô Sáu ở chợ cá quen ông ngoại từ trước. “Câu được cá thì tốt, nhưng mở quán phải biết nhập hàng, giữ khách và để dành tiền sửa bàn ghế.”',[['Bán 5 con cá','lifetimeSold',5],['Nâng cấp quán 1 lần','upgrades',1]]],
 ['Chuyến biển đầu tiên','Chú Tám','Chiếc thuyền cũ của ông ngoại nằm dưới mái bến. Chú Tám chỉ ra rạn san hô xanh: “Con sửa máy, chúng ta sẽ đi tới nơi ông từng câu cá.”',[['Câu 8 con cá','lifetimeCaught',8],['Mở vùng biển 2','area',2]]],
 ['Đêm hội làng chài','Bà Năm','Ngày hội làng sắp đến. Bà Năm mang giỏ rau thơm tới: “Quán mình lo mâm hải sản cho bà con nhé!” Ngọn đèn trước quán lại sáng mỗi đêm.',[['Bán 12 con cá','lifetimeSold',12],['Nâng cấp quán 2 lần','upgrades',2]]],
 ['Bí mật hải đăng','Người giữ đèn','Bạn tìm thấy trang nhật ký của ông ngoại, cùng bức vẽ ngọn hải đăng và một vùng biển chưa ai khám phá. Hành trình thật sự mới bắt đầu.',[['Câu 20 con cá','lifetimeCaught',20],['Mở vùng biển 3','area',3]]]
];
function unlockedChapter(){let u=1;for(let i=0;i<STORY.length-1;i++){if(STORY[i][3].every(g=>(game[g[1]]||0)>=g[2]))u=i+2;else break;}return u}
function showStory(chapter=unlockedChapter(),tab='story'){
 const body=document.getElementById('body'), s=STORY[chapter-1],u=unlockedChapter();
 body.innerHTML = `<div class="chapters">${STORY.map((c,i)=>`<button ${i>=u?'disabled':''} onclick="showStory(${i+1})">${i+1}</button>`).join('')}</div>
 <div class="chapters"><button onclick="showStory(${chapter},'story')">📖 Cốt truyện</button><button onclick="showStory(${chapter},'goals')">🎯 Mục tiêu</button></div>
 <div class="paper"><small>CHƯƠNG ${chapter} · BẾN NHỎ</small><h3>${s[0]}</h3>
 ${tab==='story'?`<img class="scene-img" src="../public/assets/concept-preview.webp" alt="Làng chài"/><p>✦ ${s[1]} kể chuyện ✦</p><p>${s[2]}</p>`:`<div class="goals">${s[3].map(g=>`<div>${(game[g[1]]||0)>=g[2]?'✅':'🔒'} ${g[0]}: ${Math.min(game[g[1]]||0,g[2])}/${g[2]}</div>`).join('')}</div>`}
 <p>📜 Hoàn thành nhiệm vụ để mở chương sau.</p></div>`;
 if(guide==='story')guideSkip();
}
const GUIDES={intro:['👋 Chào mừng đến Bến Nhỏ!','Ông ngoại để lại quán hải sản và chiếc cần câu. Hãy học cách dựng lại quán cùng chú Tám!','Bắt đầu'],fish:['🎣 Bước 1 · Đi câu cá','Mở Câu cá, canh thanh chỉ thị trong vùng xanh rồi giật cần thành công.','Đi câu'],market:['🧺 Bước 2 · Nhập hàng','Nhập một món hải sản bằng xu ảo trong chợ ven biển.','Đến chợ'],sell:['🍽️ Bước 3 · Phục vụ khách','Khách đi vào, chọn bàn và đợi món. Bán một con cá để phục vụ khách.','Bán cá'],story:['📖 Bước 4 · Đọc truyện','Mở Chuyện Bến Nhỏ để khám phá cốt truyện và mục tiêu chương.','Đọc truyện']};
function drawGuide(){let box=document.getElementById('coach');box.style.display=guide==='done'||panel?'none':'block';if(guide==='done')return;let g=GUIDES[guide];document.getElementById('guide-title').textContent=g[0];document.getElementById('guide-body').textContent=g[1];document.getElementById('guide-next').textContent=g[2]}
function guideNext(){if(guide==='intro')guide='fish';else if(guide==='story'){show('story');guideSkip();return;}else{show(guide==='market'?'market':guide==='sell'?'sell':'fish')}drawGuide()}
function guideSkip(){guide='done';localStorage.setItem('qhs-standalone-guide','done');drawGuide()}
function advanceGuide(action){if((guide==='fish'&&action==='fish')||(guide==='market'&&action==='buy')||(guide==='sell'&&action==='sell')){guide=guide==='fish'?'market':guide==='market'?'sell':'story';drawGuide()}}
const customers=[];const scene=document.querySelector('.scene');let npcSeq=0;
function updateQueue(){let n=customers.filter(c=>c.waiting).length;let q=document.getElementById('queue');q.style.display=n?'block':'none';q.textContent='🍽️ '+n+' khách đang gọi món'}
function exitNPC(c,served=false){if(c.leaving)return;c.leaving=true;c.waiting=false;clearTimeout(c.timeout);let bubble=c.el.querySelector('.bubble');bubble.textContent=served?'💛':'👋';c.el.style.left='94%';c.el.style.top='65%';updateQueue();setTimeout(()=>{c.el.remove();let i=customers.indexOf(c);if(i>=0)customers.splice(i,1)},3900)}
function serveNPC(){let c=customers.find(c=>c.waiting);if(c)exitNPC(c,true)}
function spawnNPC(){if(customers.length>=3)return;const seats=[[49,75],[75,76],[49,89],[82,90],[62,84]];const dest=seats[Math.floor(Math.random()*seats.length)];let el=document.createElement('div');el.className='npc';el.style.left='94%';el.style.top='64%';el.innerHTML='<span class="bubble" style="display:none">🍽️</span>'+['🧑🏻','👩🏻','🧑🏽','👨🏻','👩🏽'][npcSeq++%5];el.onclick=()=>show('sell');scene.appendChild(el);let c={el,waiting:false,leaving:false,timeout:null};customers.push(c);setTimeout(()=>{if(c.leaving)return;el.style.left=dest[0]+'%';el.style.top=dest[1]+'%'},75);setTimeout(()=>{if(c.leaving)return;c.waiting=true;el.querySelector('.bubble').style.display='block';updateQueue();c.timeout=setTimeout(()=>exitNPC(c),17000)},4000)}
setTimeout(spawnNPC,800);setTimeout(spawnNPC,2400);setInterval(spawnNPC,7500);
render();drawGuide();
</script></body></html>
